name: Preview dungeon statistics
on:
  push:
    branches: [preview/dungeon-companions-20261121]
    paths:
      - '.github/workflows/preview-dungeon-statistics.yml'
      - 'preview_dungeon_statistics.py'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Collect public dungeon counters
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python3 preview_dungeon_statistics.py
      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-statistics-preview
          path: dungeon-statistics.json
          retention-days: 1
