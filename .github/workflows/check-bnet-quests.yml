name: Check Wailing Caverns readiness
on:
  push:
    branches: ['test/bnet-completed-quests-20261117']
    paths: ['.github/workflows/check-bnet-quests.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Count completed and active Wailing Caverns quests
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        shell: python
        run: |
          import base64
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          def request_json(label, request):
              try:
                  with urlopen(request, timeout=25) as response:
                      print(f"{label}: HTTP {response.status}", flush=True)
                      return json.load(response)
              except HTTPError as error:
                  raise SystemExit(f"{label}: HTTP {error.code}") from None

          for key in ("BLIZZARD_CLIENT_ID", "BLIZZARD_CLIENT_SECRET"):
              if not os.environ.get(key):
                  raise SystemExit(f"Missing repository secret: {key}")
          credentials = os.environ["BLIZZARD_CLIENT_ID"] + ":" + os.environ["BLIZZARD_CLIENT_SECRET"]
          basic = base64.b64encode(credentials.encode()).decode()
          token_data = request_json("Battle.net OAuth", Request(
              "https://oauth.battle.net/token",
              data=b"grant_type=client_credentials",
              headers={"Authorization": f"Basic {basic}", "Content-Type": "application/x-www-form-urlencoded"},
          ))
          token = token_data.get("access_token")
          if not token:
              raise SystemExit("No access token in OAuth response")
          print(f"::add-mask::{token}", flush=True)
          base = "https://eu.api.blizzard.com/profile/wow/character/dargor-springhill/quests"
          query = "?namespace=profile-forever-eu&locale=en_GB"
          headers = {"Authorization": f"Bearer {token}"}
          completed = request_json("Completed quests", Request(base + "/completed" + query, headers=headers))
          journal = request_json("Quest journal", Request(base + query, headers=headers))

          def quest_ids(entries):
              if not isinstance(entries, list):
                  raise SystemExit("Blizzard did not return a quest list for this category")
              result = set()
              for entry in entries:
                  quest_id = entry.get("quest", entry).get("id")
                  if not isinstance(quest_id, int):
                      raise SystemExit("Unexpected quest entry shape")
                  result.add(quest_id)
              return result

          dungeon = {914, 959, 962, 1486, 1487, 1491, 6981}
          before_entry = dungeon - {6981}
          done = dungeon & quest_ids(completed.get("quests"))
          print("WC completed count:", len(done))
          if not isinstance(journal.get("in_progress"), list):
              print("Active quest list unavailable. Journal fields:", sorted(journal))
          else:
              active = (dungeon - done) & quest_ids(journal["in_progress"])
              print("WC active count:", len(active))
              print("WC neither completed nor active count:", len(dungeon - done - active))
              print("All six pre-run quests completed or active:", before_entry <= (done | active))
