name: Build dungeon quest preview
on:
  push:
    branches: ['test/bnet-completed-quests-20261117']
    paths:
      - '.github/workflows/check-bnet-quests.yml'
      - 'dungeons/**'
      - 'roster.json'
      - 'update.py'
      - 'template.html'
      - 'test_dungeon_quests.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test update and quest handling
        run: python -m unittest discover
      - name: Collect profiles and dungeon quests and build the test page
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python update.py --output _site/index.html
      - name: Verify the live build for every roster member and dungeon
        shell: python
        run: |
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path.cwd()))
          from dungeons.quests import character_key
          roster = json.loads(Path('roster.json').read_text())
          heroes = {character_key(name) for names in roster['owners'].values() for name in names}
          catalog = json.loads(Path('dungeons/catalog.json').read_text())
          snapshot = json.loads(Path('.dungeon-quests-cache.json').read_text())
          assert set(snapshot['heroes']) == heroes
          allowed = {q['id'] for d in catalog for q in d['quests']}
          for data in snapshot['heroes'].values():
              active, done = set(data['active']), set(data['done'])
              assert active.isdisjoint(done) and (active | done) <= allowed
          html = Path('_site/index.html').read_text()
          for hero in heroes:
              assert html.count(f'data-member="{hero}"') == len(catalog)
          assert html.count('Не взяты · ') == len(heroes) * len(catalog)
          assert html.count('В журнале · ') == len(heroes) * len(catalog)
          assert html.count('Сданы · ') == len(heroes) * len(catalog)
          assert 'C_QuestLog' not in html
          print(f'Verified detailed quest status for {len(heroes)} heroes across {len(catalog)} dungeons.')
