name: Refresh confirmed profession recipes
on:
  push:
    branches: [preview/armory-refresh-20261124]
    paths: ['.github/workflows/snapshot-recipes-preview.yml']
permissions:
  contents: read
jobs:
  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch only the roster's learned professions and recipes
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python snapshot_professions.py
