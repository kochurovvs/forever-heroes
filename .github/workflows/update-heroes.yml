name: Update heroes and deploy Pages
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'roster.json'
      - 'update.py'
      - 'template.html'
      - 'icons.json'
      - '.github/workflows/update-heroes.yml'
permissions:
  contents: read
concurrency:
  group: heroes-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record trigger and collection time
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          printf 'Trigger: %s\n' "$TRIGGER_EVENT"
          date -u '+Started: %Y-%m-%dT%H:%M:%SZ'
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify failure handling
        run: python -m unittest discover -p test_update.py
      - name: Collect all profiles and build candidate
        run: python update.py --output _site/index.html
      - name: Upload successful site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy successful collection
        id: deployment
        uses: actions/deploy-pages@v4
