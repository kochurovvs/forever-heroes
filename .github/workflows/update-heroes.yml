name: Update heroes and deploy Pages
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'roster.json'
      - 'group-2/**'
      - 'dungeon-enjoyers/**'
      - 'update.py'
      - 'template.html'
      - 'dungeons/**'
      - 'armory/**'
      - 'test_dungeon_quests.py'
      - 'icons.json'
      - '.github/workflows/update-heroes.yml'
permissions:
  contents: read
concurrency:
  group: heroes-pages
  cancel-in-progress: false
jobs:
  build:
    outputs:
      artifact_name: ${{ steps.site.outputs.name }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record trigger and collection time
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          printf 'Trigger: %s\n' "$TRIGGER_EVENT"
          date -u '+Started: %Y-%m-%dT%H:%M:%SZ'
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image support
        run: python -m pip install "Pillow>=11,<14"
      - name: Verify failure handling
        run: python -m unittest discover
      - name: Refresh roster and dungeon quests from Battle.net
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          python update.py --pages --output _site/index.html
          python update.py --roster group-2/roster.json --pages --output _site/group-2/index.html
          python update.py --roster dungeon-enjoyers/roster.json --pages --output _site/dungeon-enjoyers/index.html
      - name: Set Pages artifact name
        id: site
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload successful site
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.site.outputs.name }}
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy successful collection
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
